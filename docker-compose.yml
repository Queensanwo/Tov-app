services:
  postgres:
    image: postgres:16-alpine
    container_name: tov-postgres
    environment:
      POSTGRES_DB: tov
      POSTGRES_USER: tov
      POSTGRES_PASSWORD: tov_dev_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: tov-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
